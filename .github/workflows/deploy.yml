name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - id: decide
        run: |
          if [ -n "$CF_ACCOUNT_ID" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build frontend assets
        run: npm run build

      # 部署到现有 worker "nodewarden"（wrangler.toml 已声明 D1/R2/DO，
      # D1 按 database_name 解析复用现有库，数据保留）
      - name: 🚀 Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # 关键：上游 wrangler.toml 未声明 JWT_SECRET（也无 keep_vars），
      # wrangler deploy 会清除线上该 secret。部署后必须立即重设，
      # 否则所有客户端 JWT 失效需要重新登录。
      - name: 🔑 Restore JWT_SECRET
        run: echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: ✅ Deployment Success
        if: success()
        run: echo "🎉 部署成功！"

      - name: ❌ Deployment Failed
        if: failure()
        run: echo "💥 部署失败！请检查 Actions 日志"
