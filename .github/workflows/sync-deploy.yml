name: Sync & Deploy

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 00:00（北京时间 08:00）
  workflow_dispatch:

jobs:
  sync-and-deploy:
    name: Sync upstream then deploy if changed
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: shuaiplus/nodewarden
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false

      # 门禁：上游有新版(同步产生新提交) 或 手动触发(workflow_dispatch) 才部署
      - name: Setup Node.js
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Build frontend assets
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # 上游 wrangler.toml 未声明 JWT_SECRET，wrangler deploy 会清除线上该 secret，
      # 部署后必须重设，否则所有客户端 JWT 失效需重新登录。
      - name: Restore JWT_SECRET
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        run: echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
